version: '3.9'
services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: shop_db
      DB_USER: root
      DB_PASS: example
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: shop_db
    volumes:
      - dbdata:/var/lib/mysql
      - ./shop_db.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
volumes:
  dbdata:
